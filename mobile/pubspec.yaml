name: ieum_mobile
description: "이음 (Ieum) — 부모님과 함께하는 하루 한 질문 기록 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_secure_storage: ^11.2.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  kakao_flutter_sdk_user: 2.1.0
  naver_login_sdk: 3.2.1
  record: ^6.2.1
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
